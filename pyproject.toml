[project]
name = "lean"
version = "0.1.0"
description = "Project LEAN: The Priced-Quanta Equation for Neural Network Compressibility"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.14.0",
    "transformers>=5.19.0",
    "datasets>=5.1.0",
    "mlx>=0.32.0",
    "mlx-lm>=0.32.0",
    "scipy>=1.17.0",
    "statsmodels>=0.15.0",
    "hydra-core>=1.3.0",
    "pytest>=9.0.0",
    "ruff>=0.16.0",
    "zstandard>=0.25.0",
    "pandas>=3.0.0",
    "pyarrow>=26.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
